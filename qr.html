<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一水千田｜展場 QR Code</title>
<style>
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:#3a3f35;color:#2e3229}
.wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fffaf0;border:4px solid #2e3229;border-radius:24px;padding:18px 22px;box-shadow:0 6px 0 #1d201b;text-align:center}
h1{margin:4px 0;font-size:34px}h2{margin:4px 0 8px;font-size:22px}
.qr{display:inline-block;background:#fff;border:3px solid #2e3229;border-radius:14px;padding:8px;margin:8px 0}
.url{font-size:15px;word-break:break-all;color:#6b5a35}
.step{font-size:20px;font-weight:bold;background:#ffd166;border:3px solid #2e3229;border-radius:999px;display:inline-block;padding:2px 16px;margin-bottom:6px}
.tips{text-align:left;font-size:14px;line-height:1.7;background:#fff1c9;border-radius:14px;padding:8px 14px;margin-top:8px}
.warn{background:#ffe1cf;border:2px solid #e08a4a;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;text-align:left}
input,select{font:inherit;font-size:15px;border:2px solid #2e3229;border-radius:10px;padding:5px 8px;width:100%;box-sizing:border-box;margin:3px 0}
button{font:inherit;font-size:15px;border:2.5px solid #2e3229;border-radius:999px;background:#ffd166;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 #2e3229;margin:4px}
.tool{grid-column:1/-1;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr 140px;gap:8px;align-items:end}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media print{body{background:#fff}.tool,.noprint{display:none}.wrap{grid-template-columns:1fr 1fr}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<div class="wrap">
 <div class="card" id="cWifi"><div class="step">步驟 1</div><h2>手機連上展場 Wi‑Fi</h2><div class="qr" id="qWifi"></div><div class="url" id="tWifi"></div>
  <div class="tips">用手機相機掃描，就會跳出「加入網路」。<br>不需要網際網路，遊戲直接從展場電腦傳到手機。</div></div>
 <div class="card"><div class="step">步驟 2</div><h1>💧 一水千田・時光水滴</h1><div class="qr" id="qGame"></div><div class="url" id="tGame"></div>
  <div class="tips">掃描後直接在瀏覽器遊玩，不用登入、不用安裝。<br>左下角搖桿移動；靠近人物點「說話」。</div></div>
 <div class="card tool noprint"><h2>⚙️ 展場設定（列印時不會出現）</h2>
  <div id="msg"></div>
  <div class="row"><label>Wi‑Fi 名稱（SSID）<input id="ssid" placeholder="例如 YishuiQiantian"></label><label>Wi‑Fi 密碼<input id="pw" placeholder="開放網路可留空"></label><label>加密方式<select id="sec"><option value="WPA">WPA/WPA2/WPA3</option><option value="nopass">無密碼</option><option value="WEP">WEP</option></select></label></div>
  <label>遊戲網址（自動帶入；若放到 GitHub Pages 等公開網站，可改成那個網址）<input id="gurl"></label>
  <label><input type="checkbox" id="hideWifi" style="width:auto"> 不使用展場 Wi‑Fi（遊戲放在公開網站時勾選，只顯示遊戲 QR Code）</label><br>
  <button id="bGo">更新 QR Code</button><button id="bPrint">🖨️ 列印海報</button><button id="bOpen">在這台電腦開啟遊戲</button>
 </div>
</div>
<script>
/* 迷你 QR Code 產生器（位元組模式，版本 1–40，糾錯 L/M/Q/H）。依 ISO/IEC 18004 規格實作，無外部相依。 */
const QRGen=(function(){
const ECC=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
[-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
const NB=[[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const FMT=[1,0,3,2]; // L,M,Q,H 的格式位元
function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
const dataCW=(v,e)=>Math.floor(rawMods(v)/8)-ECC[e][v]*NB[e][v];
function gmul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
function rsDiv(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<r.length;j++){r[j]=gmul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=gmul(root,2)}return r}
function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=gmul(c,f))}return r}
function encode(text,ecl){const e={L:0,M:1,Q:2,H:3}[ecl||'M'];
 const bytes=Array.from(new TextEncoder().encode(text));let v=1;
 for(;v<=40;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCW(v,e)*8)break}if(v>40)throw new Error('too long');
 const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
 put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
 const cap=dataCW(v,e)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
 for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a*2+b,0));
 // 分塊＋糾錯碼＋交錯
 const nb=NB[e][v],ec=ECC[e][v],raw=Math.floor(rawMods(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(ec);const blocks=[];
 for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-ec+(i<ns?0:1));k+=d.length;const r=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(r))}
 const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-ec||j>=ns)all.push(b[i])});
 // 模組矩陣
 const N=v*4+17,M=[...Array(N)].map(()=>Array(N).fill(false)),F=[...Array(N)].map(()=>Array(N).fill(false));
 const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
 for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
 const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)set(xx,yy,d!==2&&d!==4)}};
 finder(3,3);finder(N-4,3);finder(3,N-4);
 if(v>1){const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,pos=[6];for(let p=N-7;pos.length<n;p-=step)pos.splice(1,0,p);
  pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
 const drawFmt=mask=>{const d=FMT[e]<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412,g=i=>((b>>>i)&1)===1;
  for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
  for(let i=0;i<8;i++)set(N-1-i,8,g(i));for(let i=8;i<15;i++)set(8,N-15+i,g(i));set(8,N-8,true)};
 drawFmt(0);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)===1,a=N-11+i%3,c=Math.floor(i/3);set(a,c,bt);set(c,a,bt)}}
 // 放資料
 let i=0;for(let right=N-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<N;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?N-1-vert:vert;
  if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
 const maskF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
 const applyMask=m=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!F[y][x]&&maskF[m](x,y))M[y][x]=!M[y][x]};
 const penalty=()=>{let p=0;
  for(let k=0;k<2;k++)for(let a=0;a<N;a++){let run=1,hist=[];for(let b=1;b<=N;b++){const cur=b<N?(k?M[b][a]:M[a][b]):null,prev=k?M[b-1][a]:M[a][b-1];if(b<N&&cur===prev)run++;else{if(run>=5)p+=run-2;run=1}}}
  for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
  const pat=[true,false,true,true,true,false,true];
  for(let k=0;k<2;k++)for(let a=0;a<N;a++)for(let b=0;b+7<=N;b++){let ok=true;for(let t=0;t<7;t++)if((k?M[b+t][a]:M[a][b+t])!==pat[t]){ok=false;break}
   if(!ok)continue;const before=b>=4&&[1,2,3,4].every(t=>!(k?M[b-t][a]:M[a][b-t])),after=b+11<=N&&[7,8,9,10].every(t=>!(k?M[b+t][a]:M[a][b+t]));if(before||after)p+=40}
  let dark=0;M.forEach(r=>r.forEach(c=>dark+=c));p+=Math.floor(Math.abs(dark*20-N*N*10)/(N*N))*10;return p};
 let best=0,bp=1e9;for(let m=0;m<8;m++){applyMask(m);drawFmt(m);const p=penalty();if(p<bp){bp=p;best=m}applyMask(m)}
 applyMask(best);drawFmt(best);return M}
function toSVG(text,ecl,px){const M=encode(text,ecl),N=M.length,q=4;let d='';M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q},${y+q}h1v1h-1z`}));
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N+2*q} ${N+2*q}" width="${px||240}" height="${px||240}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
return{encode,toSVG}})();


const $=s=>document.querySelector(s);
const store={get:k=>{try{return localStorage.getItem('yq_'+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('yq_'+k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wesc=s=>String(s).replace(/([\;,:"])/g,'\\$1');
const here=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');
const isLocal=/^(localhost|127\.|\[::1\])/.test(location.hostname),isFile=location.protocol==='file:';
$('#gurl').value=store.get('gurl')||(isFile?'':here+'index.html');
$('#ssid').value=store.get('ssid')||'';$('#pw').value=store.get('pw')||'';$('#sec').value=store.get('sec')||'WPA';$('#hideWifi').checked=store.get('hide')?store.get('hide')==='1':location.protocol==='https:';
function draw(){const g=$('#gurl').value.trim(),ss=$('#ssid').value.trim(),pw=$('#pw').value,sec=$('#sec').value,hide=$('#hideWifi').checked;
 store.set('ssid',ss);store.set('pw',pw);store.set('sec',sec);store.set('hide',hide?'1':'0');if(g!==here+'index.html')store.set('gurl',g);
 let m='';
 if(isFile)m+='<div class="warn">⚠️ 這個頁面是直接用檔案開啟的，手機連不到。請執行「啟動展場（Windows）」或「啟動展場（Mac）」，它會用區網網址自動開啟本頁。</div>';
 else if(isLocal&&/localhost|127\.|\[::1\]/.test(g))m+='<div class="warn">⚠️ 目前網址是 localhost，只有這台電腦連得到。請改用啟動程式顯示的「http://192.168.x.x:埠號/」網址開啟本頁。</div>';
 if(/^http:/.test(g)&&!hide&&!ss)m+='<div class="warn">請填入展場 Wi‑Fi 名稱，手機才能先連上同一個網路。</div>';
 $('#msg').innerHTML=m;
 $('#qGame').innerHTML=g?QRGen.toSVG(g,'M',300):'<p style="width:300px">（尚未設定遊戲網址）</p>';$('#tGame').textContent=g;
 $('#cWifi').style.display=hide?'none':'';
 if(!hide){const w=sec==='nopass'?`WIFI:T:nopass;S:${wesc(ss)};;`:`WIFI:T:${sec};S:${wesc(ss)};P:${wesc(pw)};;`;
  $('#qWifi').innerHTML=ss?QRGen.toSVG(w,'M',300):'<p style="width:300px">（請在下方填入 Wi‑Fi 名稱）</p>';$('#tWifi').textContent=ss?`Wi‑Fi：${ss}${sec==='nopass'?'（無密碼）':'　密碼：'+pw}`:''}}
['ssid','pw','sec','gurl','hideWifi'].forEach(id=>$('#'+id).addEventListener('input',draw));$('#sec').onchange=draw;$('#hideWifi').onchange=draw;
$('#bGo').onclick=draw;$('#bPrint').onclick=()=>{try{print()}catch(e){}};$('#bOpen').onclick=()=>{location.href=$('#gurl').value||'index.html'};
draw();
</script></body></html>
